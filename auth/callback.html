<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCTT - 로그인 처리중...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e2e8f0;
        }
        .callback-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top: 4px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin-bottom: 10px; font-size: 1.3rem; }
        p { color: #94a3b8; font-size: 0.9rem; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="callback-box">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">🐾 로그인 처리중...</h2>
        <p id="message">잠시만 기다려주세요</p>
    </div>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const hash = new URLSearchParams(window.location.hash.substring(1));
            
            const token = params.get('token') || hash.get('token');
            const name = params.get('name') || hash.get('name');
            const email = params.get('email') || hash.get('email');
            const error = params.get('error') || hash.get('error');
            
            const title = document.getElementById('title');
            const message = document.getElementById('message');
            const spinner = document.getElementById('spinner');
            
            if (error) {
                spinner.style.display = 'none';
                title.innerHTML = '❌ 로그인 실패';
                title.className = 'error';
                message.textContent = decodeURIComponent(error);
                setTimeout(() => { window.location.href = '/'; }, 3000);
                return;
            }
            
            if (token) {
                localStorage.setItem('petctt_token', token);
                if (name || email) {
                    localStorage.setItem('petctt_user', JSON.stringify({
                        name: decodeURIComponent(name || ''),
                        email: decodeURIComponent(email || ''),
                        loginTime: new Date().toISOString()
                    }));
                }
                spinner.style.display = 'none';
                title.innerHTML = '✅ 로그인 성공!';
                title.className = 'success';
                message.textContent = (name ? decodeURIComponent(name) + '님 ' : '') + '환영합니다! 🎉';
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } else {
                spinner.style.display = 'none';
                title.innerHTML = '⚠️ 인증 정보 없음';
                message.textContent = '메인 페이지로 이동합니다...';
                setTimeout(() => { window.location.href = '/'; }, 2000);
            }
        })();
    </script>
</body>
</html>
