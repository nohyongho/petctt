<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetCTT - 카카오 로그인 처리중...</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<style>
body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#1a1a2e; color:#fff; font-family:-apple-system,sans-serif; }
.loader { text-align:center; }
.spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,0.2); border-top-color:#FEE500; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>카카오 로그인 처리중...</p>
</div>
<script>
// 카카오 SDK 초기화
if (!Kakao.isInitialized()) Kakao.init('fa5158f6f9735b0f0d0bd39a7158393b');

// URL에서 code 파라미터 추출
var urlParams = new URLSearchParams(window.location.search);
var code = urlParams.get('code');

if (code) {
  // 카카오 인증코드로 사용자 정보 가져오기
  // Kakao.Auth.setAccessToken 대신 authorize 리다이렉트 방식 사용
  // code → Kakao REST API로 토큰 교환은 서버 필요하므로
  // 대안: Kakao JS SDK의 Kakao.API.request로 직접 처리
  
  // 간단한 방법: code를 이용해 Kakao에서 토큰 받기 (클라이언트 사이드)
  fetch('https://kauth.kakao.com/oauth/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      client_id: 'fa5158f6f9735b0f0d0bd39a7158393b',
      redirect_uri: window.location.origin + '/pages/kakao-callback.html',
      code: code
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(tokenData) {
    if (tokenData.access_token) {
      Kakao.Auth.setAccessToken(tokenData.access_token);
      // 사용자 정보 가져오기
      return Kakao.API.request({ url: '/v2/user/me' });
    } else {
      throw new Error('토큰 교환 실패: ' + JSON.stringify(tokenData));
    }
  })
  .then(function(user) {
    var profile = (user.kakao_account && user.kakao_account.profile) || {};
    var authData = {
      id: 'kakao_' + user.id,
      email: (user.kakao_account && user.kakao_account.email) || '',
      name: profile.nickname || '카카오 사용자',
      avatar: profile.profile_image_url || profile.thumbnail_image_url || '',
      provider: 'kakao',
      token: Kakao.Auth.getAccessToken()
    };
    // 부모 페이지의 localStorage에 저장
    localStorage.setItem('petctt_unified_auth', JSON.stringify(authData));
    // airctt 세션도 동기화
    localStorage.setItem('airctt_consumer_session', JSON.stringify({
      access_token: authData.token,
      refresh_token: '',
      user: authData
    }));
    localStorage.setItem('airctt_consumer_user', JSON.stringify(authData));
    
    // 메인 페이지로 이동
    window.location.href = window.location.origin;
  })
  .catch(function(err) {
    console.error('카카오 로그인 오류:', err);
    document.querySelector('.loader').innerHTML = '<p style="color:#EF4444;">로그인 처리 중 오류가 발생했습니다.</p><p style="font-size:0.8rem;color:#888;">' + err.message + '</p><a href="/" style="color:#FEE500;margin-top:16px;display:inline-block;">메인으로 돌아가기</a>';
  });
} else {
  // code 없으면 hash에서 access_token 확인 (implicit flow fallback)
  var hash = window.location.hash;
  if (hash && hash.indexOf('access_token') !== -1) {
    var params = {};
    hash.substring(1).split('&').forEach(function(part) {
      var kv = part.split('=');
      if (kv.length === 2) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
    });
    if (params.access_token) {
      localStorage.setItem('petctt_unified_auth', JSON.stringify({
        id: 'oauth_user',
        email: '',
        name: '사용자',
        avatar: '',
        provider: 'kakao',
        token: params.access_token
      }));
      window.location.href = window.location.origin;
    }
  } else {
    document.querySelector('.loader').innerHTML = '<p style="color:#EF4444;">인증 코드가 없습니다.</p><a href="/" style="color:#FEE500;">메인으로 돌아가기</a>';
  }
}
</script>
<!-- PetCTT 인증 모듈 -->
<script src="/public/js/auth-core.js"></script>
<script src="/public/js/ami-global.js"></script>
</body>
</html>
