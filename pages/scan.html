<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>아미 스캔 🔬</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000813;min-height:100vh;
  font-family:'Noto Sans KR',sans-serif;
  color:#fff;overflow-x:hidden;
}

/* 카메라 영역 */
#cam-wrap{
  position:relative;width:100%;
  height:60vh;min-height:320px;
  background:#000;overflow:hidden;
}
#video{width:100%;height:100%;object-fit:cover;display:block}
#canvas{display:none}
#cam-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;
  background:rgba(0,8,20,0.7);
}
#cam-overlay.hidden{display:none}

/* 스캔 프레임 */
#scan-frame{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:200px;height:200px;
  pointer-events:none;
}
.sf-corner{
  position:absolute;width:24px;height:24px;
  border-color:#00e5ff;border-style:solid;
}
.sf-tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.sf-tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.sf-bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.sf-br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.sf-line{
  position:absolute;top:50%;left:4px;right:4px;
  height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);
  animation:scanLine 2s ease-in-out infinite;
}
@keyframes scanLine{
  0%{top:10%;opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{top:90%;opacity:0}
}
#scan-frame.scanning .sf-corner{border-color:#00e676;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 아미 캐릭터 (하단) */
#ami-section{
  position:relative;
  background:linear-gradient(180deg,#000813 0%,#0a0020 100%);
  padding:16px 16px 24px;
  min-height:40vh;
}

/* 아미 + 말풍선 */
#ami-row{
  display:flex;align-items:flex-end;
  gap:14px;margin-bottom:14px;
}
#ami-char{flex-shrink:0;cursor:pointer}
#ami-char:active svg{transform:scale(.92)}

#ami-speech{
  flex:1;
  background:rgba(255,255,255,.95);
  border:2px solid #ffb3d9;
  border-radius:16px 16px 16px 4px;
  padding:12px 14px;
  font-size:13px;line-height:1.65;
  color:#333;min-height:60px;
  position:relative;
  box-shadow:0 4px 16px rgba(255,130,200,.3);
  white-space:pre-wrap;
}
#ami-speech.typing::after{
  content:'▌';animation:cur .6s infinite;color:#ffb3d9;
}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}

/* 버튼들 */
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-main{
  flex:1;padding:14px;border-radius:16px;border:none;
  font-size:14px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all .2s;min-width:100px;
}
.btn-cam{background:linear-gradient(135deg,#00e5ff,#0080ff);color:#fff}
.btn-cam:active{transform:scale(.95)}
.btn-shoot{
  background:linear-gradient(135deg,#ff80bf,#bf5fff);
  color:#fff;
}
.btn-shoot:active{transform:scale(.95)}
.btn-gallery{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2)!important;
  color:#fff;flex:0 0 auto;padding:14px 16px;
}

/* 업로드 */
#upload-inp{display:none}

/* 결과 카드 */
#result-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(0,229,255,.2);
  border-radius:16px;padding:14px;
  margin-bottom:14px;display:none;
}
#result-card.show{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.rc-preview{
  width:100%;height:160px;object-fit:cover;
  border-radius:10px;margin-bottom:10px;
}
.rc-tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.rc-tag{
  padding:3px 10px;border-radius:10px;
  font-size:11px;font-weight:700;
}
.tag-animal{background:rgba(0,230,118,.2);color:#00e676;border:1px solid rgba(0,230,118,.3)}
.tag-plant{background:rgba(0,229,255,.15);color:#00e5ff;border:1px solid rgba(0,229,255,.3)}
.tag-food{background:rgba(255,171,64,.2);color:#ffab40;border:1px solid rgba(255,171,64,.3)}
.tag-etc{background:rgba(191,95,255,.2);color:#bf5fff;border:1px solid rgba(191,95,255,.3)}
.rc-name{font-size:16px;font-weight:900;color:#f1f5f9;margin-bottom:4px}
.rc-sub{font-size:12px;color:#64748b}

/* 샘플 버튼 */
.sample-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sample-btn{
  padding:6px 12px;border-radius:12px;border:none;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#94a3b8;font-size:11px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .15s;
}
.sample-btn:hover{background:rgba(255,255,255,.15);color:#fff}

/* 로딩 */
#loading{
  display:none;
  position:absolute;inset:0;
  background:rgba(0,8,20,.85);
  align-items:center;justify-content:center;
  flex-direction:column;gap:12px;z-index:10;
  border-radius:16px;
}
#loading.show{display:flex}
.load-ring{
  width:48px;height:48px;border-radius:50%;
  border:3px solid rgba(0,229,255,.2);
  border-top-color:#00e5ff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:#00e5ff}

/* 헤더 */
#top-bar{
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,8,20,.9);
  border-bottom:1px solid rgba(0,229,255,.1);
}
.top-title{font-size:15px;font-weight:700;color:#f1f5f9}
.top-sub{font-size:11px;color:#64748b}
.top-badge{
  padding:4px 10px;border-radius:10px;
  background:rgba(0,230,118,.15);
  border:1px solid rgba(0,230,118,.25);
  font-size:11px;color:#00e676;font-weight:700;
}
</style>
</head>
<body>

<!-- 헤더 -->
<div id="top-bar">
  <div>
    <div class="top-title">🔬 아미 스캔 AI</div>
    <div class="top-sub">동물·식물·음식 뭐든 찍어봐요!</div>
  </div>
  <div class="top-badge">🐰 아미</div>
</div>

<!-- 카메라 -->
<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- 스캔 프레임 -->
  <div id="scan-frame">
    <div class="sf-corner sf-tl"></div>
    <div class="sf-corner sf-tr"></div>
    <div class="sf-corner sf-bl"></div>
    <div class="sf-corner sf-br"></div>
    <div class="sf-line"></div>
  </div>

  <!-- 카메라 없을 때 -->
  <div id="cam-overlay">
    <div style="font-size:48px">📷</div>
    <div style="font-size:14px;color:#94a3b8;text-align:center">카메라 시작 버튼을 눌러요!<br>또는 갤러리에서 사진을 골라요</div>
  </div>
</div>

<!-- 아미 섹션 -->
<div id="ami-section">
  <div style="position:relative">
    <div id="loading">
      <div class="load-ring"></div>
      <div class="load-txt">아미가 분석하는 중이야~! 🔬</div>
    </div>

    <!-- 결과 카드 -->
    <div id="result-card">
      <img id="rc-img" class="rc-preview" src="" alt="">
      <div class="rc-tag-row" id="rc-tags"></div>
      <div class="rc-name" id="rc-name"></div>
      <div class="rc-sub" id="rc-sub"></div>
    </div>

    <!-- 아미 + 말풍선 -->
    <div id="ami-row">
      <div id="ami-char" onclick="amiJump()">
        <svg width="70" height="86" viewBox="0 0 88 108" xmlns="http://www.w3.org/2000/svg"
             style="filter:drop-shadow(0 4px 14px rgba(255,150,210,.5));transition:transform .15s">
          <ellipse cx="44" cy="106" rx="24" ry="4" fill="rgba(0,0,0,.25)"/>
          <circle id="s-tail" cx="73" cy="82" r="8" fill="white" stroke="#f0c0d8" stroke-width="1.2"/>
          <g id="s-ear-l"><ellipse cx="25" cy="18" rx="9" ry="20" fill="white" stroke="#f0c0d8" stroke-width="1.2"/><ellipse cx="25" cy="20" rx="5" ry="12" fill="#ffb3d9" opacity=".75"/></g>
          <g id="s-ear-r"><ellipse cx="63" cy="18" rx="9" ry="20" fill="white" stroke="#f0c0d8" stroke-width="1.2"/><ellipse cx="63" cy="20" rx="5" ry="12" fill="#ffb3d9" opacity=".75"/></g>
          <ellipse cx="44" cy="82" rx="27" ry="23" fill="white" stroke="#f0c0d8" stroke-width="1.3"/>
          <ellipse cx="42" cy="85" rx="15" ry="14" fill="rgba(255,220,240,.38)"/>
          <circle cx="44" cy="51" r="24" fill="white" stroke="#f0c0d8" stroke-width="1.3"/>
          <ellipse cx="36" cy="41" rx="9" ry="7" fill="rgba(255,255,255,.5)" transform="rotate(-25,36,41)"/>
          <g id="s-eye-l"><ellipse cx="34" cy="50" rx="5.5" ry="5.8" fill="#1a0033"/><circle cx="36" cy="48" r="2" fill="white"/><circle cx="37" cy="47.3" r=".8" fill="white"/></g>
          <g id="s-eye-r"><ellipse cx="54" cy="50" rx="5.5" ry="5.8" fill="#1a0033"/><circle cx="56" cy="48" r="2" fill="white"/><circle cx="57" cy="47.3" r=".8" fill="white"/></g>
          <text id="s-hl" x="28" y="56" font-size="9" fill="#ff69b4" opacity="0" text-anchor="middle">♥</text>
          <text id="s-hr" x="52" y="56" font-size="9" fill="#ff69b4" opacity="0" text-anchor="middle">♥</text>
          <path id="s-mouth" d="M38,65 Q44,71 50,65" stroke="#ffb3d9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <ellipse id="s-mouth-o" cx="44" cy="66" rx="6.5" ry="0" fill="#ff80bf"/>
          <ellipse cx="27" cy="57" rx="5.5" ry="3.8" fill="rgba(255,140,185,.33)"/>
          <ellipse cx="61" cy="57" rx="5.5" ry="3.8" fill="rgba(255,140,185,.33)"/>
          <ellipse cx="33" cy="103" rx="10" ry="6" fill="white" stroke="#f0c0d8" stroke-width="1"/>
          <ellipse cx="55" cy="103" rx="10" ry="6" fill="white" stroke="#f0c0d8" stroke-width="1"/>
        </svg>
      </div>
      <div id="ami-speech">
        안녕!! 나 아미야~ 🐰<br>사진 찍으면 내가 다 알려줄게! 📷✨
      </div>
    </div>

    <!-- 샘플 -->
    <div style="font-size:11px;color:#475569;margin-bottom:6px">📌 예시로 물어보기</div>
    <div class="sample-row">
      <button class="sample-btn" onclick="sampleScan('강아지')">🐕 강아지</button>
      <button class="sample-btn" onclick="sampleScan('고양이')">🐈 고양이</button>
      <button class="sample-btn" onclick="sampleScan('장미꽃')">🌹 장미</button>
      <button class="sample-btn" onclick="sampleScan('몬스테라')">🌿 몬스테라</button>
      <button class="sample-btn" onclick="sampleScan('앵무새')">🦜 앵무새</button>
      <button class="sample-btn" onclick="sampleScan('선인장')">🌵 선인장</button>
    </div>

    <!-- 버튼 -->
    <!-- 남은 횟수 배지 -->
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px">
  <div id="scan-badge"></div>
  <a href="../pages/pricing.html" style="font-size:11px;color:#6366f1;text-decoration:none">업그레이드 →</a>
</div>
<div class="btn-row">
      <button class="btn-main btn-cam" onclick="startCam()">📷 카메라 시작</button>
      <button class="btn-main btn-shoot" id="shoot-btn" onclick="shoot()" style="display:none">🔬 지금 스캔!</button>
      <button class="btn-main btn-gallery" onclick="document.getElementById('upload-inp').click()">🖼️ 갤러리</button>
    </div>
    <input type="file" id="upload-inp" accept="image/*" onchange="uploadScan(this)">
  </div>
</div>

<script>
// ===== 아미 애니 =====
let sAT=0,sET=0,sBT=0,sBV=0,sHV=0,sMO=0;
let sJump=false,sJV=0,sJO=0;

function sAnimLoop(){
  sAT+=.05;sET+=.08;sBT++;
  if(sBT>200){sBV=1;if(sBT>212){sBV=0;sBT=0;}}
  const bS=1+Math.sin(sAT)*.018;
  const ew=Math.sin(sET)*5;
  const tw=Math.sin(sAT*1.1)*6;

  const svg=document.querySelector('#ami-char svg');
  if(svg) svg.style.transform=`scale(${bS}) translateY(${sJO}px)`;

  document.getElementById('s-ear-l').setAttribute('transform',`rotate(${-ew},25,38)`);
  document.getElementById('s-ear-r').setAttribute('transform',`rotate(${ew},63,38)`);
  document.getElementById('s-tail').setAttribute('cx',73+tw);

  const bop=sBV?.88:0;
  ['s-eye-l','s-eye-r'].forEach(id=>document.getElementById(id).setAttribute('opacity',sBV?0:1));
  document.getElementById('s-hl').setAttribute('opacity',sHV);
  document.getElementById('s-hr').setAttribute('opacity',sHV);
  if(sHV>.1){['s-eye-l','s-eye-r'].forEach(id=>document.getElementById(id).setAttribute('opacity',0));}
  const mo=sMO;
  document.getElementById('s-mouth').setAttribute('opacity',mo>0?0:1);
  const ry=mo>0?Math.sin(Date.now()/80)*2+3.5:0;
  document.getElementById('s-mouth-o').setAttribute('ry',ry);
  document.getElementById('s-mouth-o').setAttribute('opacity',mo>0?.9:0);

  if(sJump){sJV+=.8;sJO+=sJV;if(sJO>=0){sJO=0;sJV=0;sJump=false;}}
  requestAnimationFrame(sAnimLoop);
}
sAnimLoop();

function amiJump(){
  if(sJump)return;sJump=true;sJV=-10;
  sHV=1;setTimeout(()=>sHV=0,1800);
}

// ===== 카메라 =====
let stream=null;
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    const v=document.getElementById('video');
    v.srcObject=stream;
    document.getElementById('cam-overlay').classList.add('hidden');
    document.getElementById('shoot-btn').style.display='flex';
    document.getElementById('scan-frame').classList.add('scanning');
    speak('카메라 시작됐어! 찍고 싶은 거 가까이 대봐~! 📷');
    setMsg('카메라 켜졌어!! 🎉\n동물이나 식물을 가까이 대고 스캔 버튼 눌러봐~ 🔬');
  }catch(e){
    setMsg('카메라 권한이 필요해요! 🙏\n또는 갤러리에서 사진을 골라봐요 📁');
    speak('카메라 권한이 필요해! 갤러리에서 사진을 골라봐도 돼~');
  }
}

function shoot(){
  const v=document.getElementById('video');
  const c=document.getElementById('canvas');
  c.width=v.videoWidth||640;
  c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0);
  const b64=c.toDataURL('image/jpeg',.85).split(',')[1];
  analyzeImage(b64,'image/jpeg');
}

function uploadScan(inp){
  if(!inp.files[0])return;
  const r=new FileReader();
  r.onload=e=>{
    const b64=e.target.result.split(',')[1];
    const mime=inp.files[0].type||'image/jpeg';
    // 미리보기
    document.getElementById('rc-img').src=e.target.result;
    analyzeImage(b64,mime,e.target.result);
  };
  r.readAsDataURL(inp.files[0]);
}

// ===== Claude API로 이미지 분석 =====
async function analyzeImage(b64,mime,previewSrc){
  // 페이월 체크
  if(!PAYWALL.canUse('scan')){
    PAYWALL.showPopup('scan');
    return;
  }
  PAYWALL.addCount('scan');
  PAYWALL.renderBadge('scan','scan-badge');
  showLoading(true);
  amiJump();
  setMsg('분석하는 중이야~! 잠깐만 기다려! 🔬✨');

  const SYSTEM=`당신은 아미(Ami)예요! 귀여운 6살 소녀 AI 토끼 🐰
이미지를 보고 다음을 JSON으로 답하세요:
{
  "type": "동물|식물|음식|사람|사물|기타",
  "name": "한국어 이름",
  "english": "영어 이름",
  "emoji": "관련 이모지",
  "desc": "아미 말투로 2~3문장 친근하게 설명. 특징, 성격, 돌봄 팁 포함",
  "fun_fact": "재미있는 사실 1가지",
  "care_tip": "돌봄 또는 주의사항 1가지 (동물/식물이면 필수)",
  "health": "건강 상태나 특이사항 (보이는 경우만, 없으면 null)"
}
JSON만 출력. 설명 없이.`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:SYSTEM,
        messages:[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:mime,data:b64}},
            {type:'text',text:'이 이미지를 분석해서 JSON으로 알려줘!'}
          ]
        }]
      })
    });
    const d=await res.json();
    let txt=d.content?.[0]?.text||'{}';
    txt=txt.replace(/```json|```/g,'').trim();
    const info=JSON.parse(txt);
    showResult(info,previewSrc||null);
  }catch(e){
    showLoading(false);
    setMsg('앗 분석하다가 실수했어! 😅\n다시 한번 찍어봐줘~!');
    speak('앗 분석하다가 실수했어! 다시 한번 찍어봐줘!');
  }
}

function showResult(info, previewSrc){
  showLoading(false);
  amiJump();
  sHV=1;setTimeout(()=>sHV=0,3000);

  // 결과 카드
  const card=document.getElementById('result-card');
  card.className='show';

  // 미리보기 이미지
  const img=document.getElementById('rc-img');
  if(previewSrc){img.src=previewSrc;img.style.display='block';}
  else img.style.display='none';

  // 태그
  const tagRow=document.getElementById('rc-tags');
  const tagClass={동물:'tag-animal',식물:'tag-plant',음식:'tag-food',사람:'tag-etc',사물:'tag-etc',기타:'tag-etc'};
  tagRow.innerHTML=`<span class="rc-tag ${tagClass[info.type]||'tag-etc'}">${info.emoji||''} ${info.type}</span>`;
  if(info.english) tagRow.innerHTML+=`<span class="rc-tag tag-etc">${info.english}</span>`;

  document.getElementById('rc-name').textContent=(info.emoji||'')+'  '+info.name;
  document.getElementById('rc-sub').textContent=info.fun_fact||'';

  // 아미 말풍선 타이핑
  let msg='';
  if(info.desc) msg+=info.desc+'\n\n';
  if(info.care_tip) msg+='💡 '+info.care_tip;
  if(info.health) msg+='\n\n🏥 '+info.health;

  typeMsg(msg);
  speak(info.desc||info.name+'야! 반가워~');
}

// ===== 샘플 스캔 (텍스트로 분석) =====
async function sampleScan(keyword){
  if(!PAYWALL.canUse('scan')){
    PAYWALL.showPopup('scan');
    return;
  }
  PAYWALL.addCount('scan');
  PAYWALL.renderBadge('scan','scan-badge');
  showLoading(true);
  amiJump();
  setMsg(`${keyword} 정보 찾는 중이야~! 🔍`);

  const SYSTEM=`당신은 아미(Ami)예요! 귀여운 6살 소녀 AI 토끼 🐰
"${keyword}"에 대해 JSON으로 답하세요:
{

      method:'POST',

      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:800,
        messages:[{role:'user',content:SYSTEM}]
      })
    });
    const d=await res.json();
    let txt=d.content?.[0]?.text||'{}';
    txt=txt.replace(/```json|```/g,'').trim();
    const info=JSON.parse(txt);
    showResult(info,null);
  }catch(e){
    showLoading(false);
    setMsg('앗 실수했어~ 다시 눌러봐! 😅');
  }
}

// ===== UI 헬퍼 =====
function showLoading(on){
  document.getElementById('loading').className=on?'show':'';
}
function setMsg(txt){
  const el=document.getElementById('ami-speech');
  el.className='';el.textContent=txt;
}
function typeMsg(txt){
  const el=document.getElementById('ami-speech');
  el.className='typing';el.textContent='';
  sMO=1;
  let i=0;
  const ti=setInterval(()=>{
    if(i<txt.length){el.textContent+=txt[i++];}
    else{clearInterval(ti);el.className='';sMO=0;}
  },18);
}

// ===== 목소리 =====
function speak(txt){
  if(!window.speechSynthesis||!txt)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt.replace(/[^\w\s가-힣]/g,'').trim());
  u.lang='ko-KR';u.pitch=2.0;u.rate=1.15;u.volume=.9;
  const vv=speechSynthesis.getVoices();
  const kv=vv.find(v=>v.lang.includes('ko-KR'))||vv.find(v=>v.lang.includes('ko'));
  if(kv)u.voice=kv;
  speechSynthesis.speak(u);
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

// 등장
setTimeout(()=>{
  amiJump();
  speak('안녕! 나 아미야! 사진 찍으면 내가 다 알려줄게!');

<script>
// ========== 아미 구독 페이월 v1 ==========
// 사용처: scan.html, index.html (Claude 대화)
// 무료: 스캔3회/일, 대화10회/일
// Pro: 무제한 ₩9,900/월
// Premium: 무제한+스마트글래스 ₩29,900/월

const PAYWALL = {
  LIMITS: { free: { scan: 3, chat: 10 }, pro: { scan: 9999, chat: 9999 }, premium: { scan: 9999, chat: 9999 } },

  // 현재 플랜 가져오기
  getPlan() {
    try {
      const u = JSON.parse(localStorage.getItem('petctt_user') || 'null');
      return u?.plan_id || 'free';
    } catch { return 'free'; }
  },

  // 오늘 사용 횟수
  getCount(type) {
    const key = `petctt_usage_${type}_${new Date().toDateString()}`;
    return parseInt(localStorage.getItem(key) || '0');
  },

  // 횟수 증가
  addCount(type) {
    const key = `petctt_usage_${type}_${new Date().toDateString()}`;
    localStorage.setItem(key, this.getCount(type) + 1);
  },

  // 사용 가능 여부 체크
  canUse(type) {
    const plan = this.getPlan();
    const limit = this.LIMITS[plan]?.[type] ?? 3;
    return this.getCount(type) < limit;
  },

  // 남은 횟수
  remaining(type) {
    const plan = this.getPlan();
    const limit = this.LIMITS[plan]?.[type] ?? 3;
    if (limit >= 9999) return '무제한';
    return Math.max(0, limit - this.getCount(type)) + '회';
  },

  // 팝업 표시
  showPopup(type, onSuccess) {
    // 이미 팝업 있으면 제거
    const old = document.getElementById('paywall-popup');
    if (old) old.remove();

    const plan = this.getPlan();
    const limit = this.LIMITS['free'][type];
    const typeLabel = type === 'scan' ? '스캔 AI' : 'AI 대화';

    const popup = document.createElement('div');
    popup.id = 'paywall-popup';
    popup.style.cssText = `
      position:fixed;inset:0;z-index:99999;
      display:flex;align-items:center;justify-content:center;
      padding:16px;background:rgba(0,0,0,0.82);
      backdrop-filter:blur(8px);
      animation:pwFadeIn .25s ease;
    `;

    popup.innerHTML = `
      <style>
        @keyframes pwFadeIn{from{opacity:0}to{opacity:1}}
        @keyframes pwSlideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
        #paywall-box{animation:pwSlideUp .3s cubic-bezier(.34,1.2,.64,1)}
      </style>
      <div id="paywall-box" style="
        background:#0a0020;border:1.5px solid rgba(191,95,255,.35);
        border-radius:24px;padding:28px 24px;
        width:min(380px,100%);text-align:center;
        box-shadow:0 0 60px rgba(191,95,255,.2);
      ">
        <!-- 아미 -->
        <div style="font-size:48px;margin-bottom:8px">🐰</div>
        <div style="font-size:11px;background:rgba(255,100,100,.15);border:1px solid rgba(255,100,100,.3);color:#ff8080;padding:4px 12px;border-radius:10px;display:inline-block;margin-bottom:14px">
          무료 ${typeLabel} ${limit}회 모두 사용
        </div>
        <div style="font-size:18px;font-weight:900;color:#f1f5f9;margin-bottom:6px">
          아미랑 더 놀고 싶어? 💜
        </div>
        <div style="font-size:13px;color:#94a3b8;margin-bottom:22px;line-height:1.6">
          Pro로 업그레이드하면<br>무제한으로 함께할 수 있어~! 🌟
        </div>

        <!-- 플랜 카드들 -->
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">

          <!-- Free (현재) -->
          <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;opacity:.6">
            <div style="text-align:left">
              <div style="font-size:13px;font-weight:700;color:#94a3b8">🆓 Free</div>
              <div style="font-size:11px;color:#475569;margin-top:2px">스캔 3회·대화 10회/일</div>
            </div>
            <div style="font-size:13px;font-weight:700;color:#475569">현재</div>
          </div>

          <!-- Pro -->
          <div onclick="PAYWALL.goToPricing('pro')" style="
            background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.15));
            border:1.5px solid rgba(99,102,241,.5);
            border-radius:14px;padding:12px 14px;
            display:flex;justify-content:space-between;align-items:center;
            cursor:pointer;transition:all .2s;
          " onmouseover="this.style.borderColor='#6366f1'" onmouseout="this.style.borderColor='rgba(99,102,241,.5)'">
            <div style="text-align:left">
              <div style="font-size:13px;font-weight:700;color:#a5b4fc">⚡ Pro</div>
              <div style="font-size:11px;color:#818cf8;margin-top:2px">무제한 스캔·대화·쿠폰</div>
            </div>
            <div>
              <div style="font-size:15px;font-weight:900;color:#a5b4fc">₩9,900</div>
              <div style="font-size:10px;color:#6366f1">/월</div>
            </div>
          </div>

          <!-- Premium -->
          <div onclick="PAYWALL.goToPricing('premium')" style="
            background:linear-gradient(135deg,rgba(255,171,64,.15),rgba(255,107,53,.1));
            border:1.5px solid rgba(255,171,64,.4);
            border-radius:14px;padding:12px 14px;
            display:flex;justify-content:space-between;align-items:center;
            cursor:pointer;transition:all .2s;
          " onmouseover="this.style.borderColor='#ffab40'" onmouseout="this.style.borderColor='rgba(255,171,64,.4)'">
            <div style="text-align:left">
              <div style="font-size:13px;font-weight:700;color:#ffab40">👑 Premium</div>
              <div style="font-size:11px;color:#f59e0b;margin-top:2px">Pro + 스마트글래스·매장연동</div>
            </div>
            <div>
              <div style="font-size:15px;font-weight:900;color:#ffab40">₩29,900</div>
              <div style="font-size:10px;color:#f59e0b">/월</div>
            </div>
          </div>
        </div>

        <!-- 버튼들 -->
        <button onclick="PAYWALL.goToPricing('pro')" style="
          width:100%;padding:14px;border-radius:14px;border:none;
          background:linear-gradient(135deg,#6366f1,#8b5cf6);
          color:#fff;font-size:14px;font-weight:700;
          cursor:pointer;margin-bottom:8px;
          box-shadow:0 4px 20px rgba(99,102,241,.4);
          font-family:'Noto Sans KR',sans-serif;
          transition:transform .15s;
        " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">
          ⚡ Pro 시작하기
        </button>
        <button onclick="document.getElementById('paywall-popup').remove()" style="
          width:100%;padding:10px;border-radius:12px;
          border:1px solid rgba(255,255,255,.1);
          background:transparent;color:#64748b;
          font-size:12px;cursor:pointer;
          font-family:'Noto Sans KR',sans-serif;
        ">
          나중에 할게요
        </button>

        <!-- 하단 안내 -->
        <div style="font-size:11px;color:#334155;margin-top:12px;line-height:1.5">
          내일 자정에 무료 횟수 리셋돼요 🌙<br>
          구독은 언제든 취소 가능해요
        </div>
      </div>
    `;

    document.body.appendChild(popup);
    // 배경 클릭으로 닫기
    popup.addEventListener('click', e => { if(e.target === popup) popup.remove(); });
  },

  // 프라이싱 페이지로 이동
  goToPricing(plan) {
    document.getElementById('paywall-popup')?.remove();
    const base = location.pathname.includes('/pages/') ? '../pages/pricing.html' : 'pages/pricing.html';
    location.href = base + '#' + plan;
  },

  // 사용 전 체크 (메인 함수)
  check(type, onAllow, onBlock) {
    if (this.canUse(type)) {
      this.addCount(type);
      if (onAllow) onAllow();
    } else {
      this.showPopup(type, onAllow);
      if (onBlock) onBlock();
    }
  },

  // 남은 횟수 배지 렌더링
  renderBadge(type, elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    const plan = this.getPlan();
    const rem = this.remaining(type);
    const isPro = plan !== 'free';
    el.innerHTML = isPro
      ? `<span style="color:#00e676;font-size:11px">✨ ${plan === 'premium' ? 'Premium' : 'Pro'} — 무제한</span>`
      : `<span style="color:${parseInt(rem) <= 1 ? '#ff5050' : '#ffab40'};font-size:11px">남은 횟수: ${rem}</span>`;
  }
};

window.PAYWALL = PAYWALL;

</script>

<script>
// 초기 배지 렌더링
document.addEventListener("DOMContentLoaded",()=>PAYWALL.renderBadge("scan","scan-badge"));
</script>
