function openLangDropdown() {
  const dd = document.getElementById('langDropdown');
  dd.classList.add('active');
  // Mark current selection
  dd.querySelectorAll('.lang-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.lang === currentLanguage);
  });
  document.body.style.overflow = 'hidden';
}

function closeLangDropdown() {
  const dd = document.getElementById('langDropdown');
  dd.classList.remove('active');
  document.body.style.overflow = '';
}

function selectLanguage(lang) {
  currentLanguage = lang;
  
  // Update button
  const langBtn = document.getElementById('langBtn');
  if (langBtn) {
    langBtn.innerHTML = LANG_FLAGS[lang] + ' ' + LANG_CODES[lang];
  }
  
  // Update HTML lang attribute
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  
  // Update UI
  updateUILanguage();
  
  // Update footer links
  updateFooterLanguage();
  
  // Update Coming Soon modal text
  updateComingSoonLanguage();
  
  // Save preference
  try { localStorage.setItem('petctt-lang', lang); } catch(e) {}
  
  // Close dropdown
  closeLangDropdown();
  
  // Toast
  const t = i18n[lang];
  if (typeof showToast === 'function') {
    showToast(t.langChanged, 'success');
  }
}

function updateFooterLanguage() {
  const t = i18n[currentLanguage];
  if (!t) return;
  
  // Footer links
  const footerLinks = document.querySelectorAll('footer a, .footer-links a, [href="guide.html"], [href="privacy.html"], [href="terms.html"], [href="contact.html"]');
  footerLinks.forEach(link => {
    const href = link.getAttribute('href');
    if (href === 'guide.html') link.textContent = t.guide;
    else if (href === 'privacy.html') link.textContent = t.privacy;
    else if (href === 'terms.html') link.textContent = t.terms;
    else if (href === 'contact.html') link.textContent = t.contact;
  });
}

function updateComingSoonLanguage() {
  const t = i18n[currentLanguage];
  if (!t) return;
  
  // Update Coming Soon modal if it exists
  const csTitle = document.querySelector('#comingSoonModal .coming-soon-title');
  if (csTitle) csTitle.textContent = t.comingSoon;
  
  const csDesc = document.querySelector('#comingSoonModal .coming-soon-desc');
  if (csDesc) csDesc.textContent = t.comingSoonDesc;
  
  const csEmail = document.querySelector('#comingSoonModal .email-copy-text');
  if (csEmail) csEmail.textContent = t.emailCopy;
}

// Keyboard shortcut: ESC to close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLangDropdown();
});

// Auto-restore saved language preference
(function() {
  try {
    const saved = localStorage.getItem('petctt-lang');
    if (saved && i18n[saved] && saved !== 'ko') {
      setTimeout(() => selectLanguage(saved), 500);
    }
  } catch(e) {}
})();
