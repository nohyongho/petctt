<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아미 테스트</title>
<style>
body { background:#0a0a1a; margin:0; min-height:100vh; color:#fff; font-family:sans-serif; text-align:center; padding-top:40px; }
h1 { font-size:1.2rem; }
p { font-size:0.9rem; color:#94a3b8; }
#ami-test {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:99990; display:block; width:88px; height:108px;
  outline:3px solid lime;
}
</style>
</head>
<body>
<h1>🐰 아미 테스트 페이지</h1>
<p>아래에 초록 테두리 + 흰토끼가 보이면 성공!</p>
<p>안 보이면 브라우저/디바이스 문제</p>

<div id="ami-test">
  <svg width="88" height="108" viewBox="0 0 88 108" xmlns="http://www.w3.org/2000/svg"
       style="filter:drop-shadow(0 4px 16px rgba(255,150,210,.55))">
    <ellipse cx="44" cy="106" rx="24" ry="4.5" fill="rgba(0,0,0,.2)"/>
    <circle cx="73" cy="82" r="8" fill="white" stroke="#f0c0d8" stroke-width="1.2"/>
    <circle cx="73" cy="82" r="4.5" fill="rgba(255,200,230,.45)"/>
    <g>
      <ellipse cx="25" cy="18" rx="9" ry="20" fill="white" stroke="#f0c0d8" stroke-width="1.2"/>
      <ellipse cx="25" cy="20" rx="5" ry="12.5" fill="#ffb3d9" opacity=".75"/>
    </g>
    <g>
      <ellipse cx="63" cy="18" rx="9" ry="20" fill="white" stroke="#f0c0d8" stroke-width="1.2"/>
      <ellipse cx="63" cy="20" rx="5" ry="12.5" fill="#ffb3d9" opacity=".75"/>
    </g>
    <ellipse cx="44" cy="82" rx="27" ry="23" fill="white" stroke="#f0c0d8" stroke-width="1.3"/>
    <circle cx="44" cy="51" r="24" fill="white" stroke="#f0c0d8" stroke-width="1.3"/>
    <ellipse cx="34" cy="50" rx="5.5" ry="5.8" fill="#1a0033"/>
    <circle cx="36" cy="48" r="2" fill="white"/>
    <ellipse cx="54" cy="50" rx="5.5" ry="5.8" fill="#1a0033"/>
    <circle cx="56" cy="48" r="2" fill="white"/>
    <path d="M38,65 Q44,71 50,65" stroke="#ffb3d9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="33" cy="103" rx="10" ry="6" fill="white" stroke="#f0c0d8" stroke-width="1"/>
    <ellipse cx="55" cy="103" rx="10" ry="6" fill="white" stroke="#f0c0d8" stroke-width="1"/>
  </svg>
</div>

<div style="margin-top:200px;padding:20px;background:rgba(255,255,255,0.05);border-radius:12px;margin:200px 16px 16px;">
  <h2>📋 디버그 정보</h2>
  <pre id="debug" style="text-align:left;font-size:11px;color:#64b5f6;"></pre>
</div>

<script>
var el = document.getElementById('ami-test');
var rect = el.getBoundingClientRect();
var dbg = document.getElementById('debug');
dbg.textContent = JSON.stringify({
  rect: {top:rect.top, left:rect.left, width:rect.width, height:rect.height, bottom:rect.bottom, right:rect.right},
  viewport: {w:window.innerWidth, h:window.innerHeight},
  display: getComputedStyle(el).display,
  visibility: getComputedStyle(el).visibility,
  opacity: getComputedStyle(el).opacity,
  zIndex: getComputedStyle(el).zIndex,
  position: getComputedStyle(el).position
}, null, 2);
</script>
</body>
</html>
